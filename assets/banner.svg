<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="RS-at GitHub banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#111a2e"/>
      <stop offset="1" stop-color="#1b1035"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#e879f9"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#818cf8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>
  <circle cx="1040" cy="150" r="230" fill="url(#glow)">
    <animate attributeName="r" values="210;250;210" dur="8s" repeatCount="indefinite"/>
  </circle>

  <!-- circuit traces -->
  <g fill="none" stroke="url(#accent)" stroke-width="2" stroke-linecap="round" opacity="0.55">
    <path d="M820 70 H935 L960 95"/>
    <path d="M860 160 H990 L1020 130 H1180"/>
    <path d="M840 250 H950 L980 220 H1120 L1150 250 H1220"/>
  </g>
  <g fill="#0d1117" stroke="url(#accent)" stroke-width="2">
    <circle cx="1180" cy="130" r="6"/>
    <circle cx="1220" cy="250" r="6"/>
    <circle cx="820" cy="70" r="4"/>
    <circle cx="860" cy="160" r="4"/>
    <circle cx="840" cy="250" r="4"/>
  </g>
  <circle r="4" fill="#e0f2fe">
    <animateMotion dur="4s" repeatCount="indefinite" path="M860 160 H990 L1020 130 H1180"/>
  </circle>
  <circle r="4" fill="#fae8ff">
    <animateMotion dur="5s" begin="1s" repeatCount="indefinite" path="M840 250 H950 L980 220 H1120 L1150 250 H1220"/>
  </circle>

  <!-- chip with code-bracket mark -->
  <rect x="925" y="95" width="150" height="110" rx="18" fill="#0f172a" stroke="url(#accent)" stroke-width="2"/>
  <g transform="translate(1000 150)" fill="none" stroke="#e2e8f0" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <path d="M-30 -28 L-58 0 L-30 28"/>
    <path d="M30 -28 L58 0 L30 28"/>
    <path d="M10 -36 L-10 36" stroke="url(#accent)"/>
  </g>

  <!-- text -->
  <text x="80" y="140" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Helvetica, Arial, sans-serif" font-size="76" font-weight="800" fill="#f8fafc" letter-spacing="2">RS-at</text>
  <rect x="82" y="162" width="120" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="80" y="210" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Helvetica, Arial, sans-serif" font-size="26" fill="#cbd5e1">Build · Learn · Share</text>
  <text x="80" y="250" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Helvetica, Arial, sans-serif" font-size="20" fill="#94a3b8">持续构建，持续学习，乐于分享</text>
</svg>
